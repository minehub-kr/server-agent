name: Release

on:
  release:
    types: [ created ]

permissions:
  contents: write

jobs:
  build:
    name: Release ${{ matrix.mc-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.unsupported }}

    strategy:
      fail-fast: false
      matrix:
        mc-version: [1.17.1, 1.18.2, 1.19.2]
        unsupported: [false]

        include:
          - mc-version: 1.8.8
            unsupported: true
            
          - mc-version: 1.12.2
            unsupported: true

          - mc-version: 1.16.5
            unsupported: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: "17"
          cache: 'gradle'
      - name: Change target version to ${{ matrix.mc-version }}
        run: |
          bash .github/workflow-files/change-ver.sh "${{ matrix.mc-version }}"
      - name: Build release with shadowJar
        run: bash ./gradlew --no-daemon "-PreleaseVersion=${VER_TAG#v}" shadowJar
        env:
          VER_TAG: ${{ github.event.release.tag_name }}
      - name: Rename package
        run: |
          mkdir releases
          release_version=${VER_TAG#v}
          suffix=""
          if [[ "$UNSUPPORTED" == "true" ]]; then
            suffix="-unsupported"
          fi
          mv "build/libs/agent-${release_version}-all.jar" "releases/agent-${release_version}-mc${MC_VERSION}${suffix}.jar"
        env:
          VER_TAG: ${{ github.event.release.tag_name }}
          MC_VERSION: ${{ matrix.mc-version }}
          UNSUPPORTED: ${{ matrix.unsupported }}
      - name: Upload packages to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: releases/agent-*.jar
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
